# Logging verbosity: 0=fatal only, 1=important operational events (recommended),
# 2=retry/filtering details, 3=per-message trace diagnostics.
debug_level: 1
# Leave empty to log to stderr, which is recommended for containers.
log_file:
# IP of the collector you are trying to connect to (BGProutes.io's side)
collector_ip: 
# Port to which the proxy must connect
collector_port:
# ID of your collector (<asn>_<IP>)
collector_id:
# Token taken from the website
cert_token:
# Directory inside the docker container where the certificates will be stored
internal_directory:
# Do we need to use TLS ?
use_tls:
# Local Addr to bind
local_addr:
# Local Port to bind
local_port:
# Host on which the certificate renewer will receive the commands (usually
# 127.0.0.1 inside a docker container)
command_host:
# Port on which the certificate renewer will receive the commands (usually
# 5555 inside a docker container)
command_port:
# List of ASNs from which we want to filter the data (BMP only). List of INT comma separated
blacklisted_asns:
# List of IPs from which we want to filter the data (BMP only). List of STR IPs comma separated
blacklisted_ips:
# Protocol transported by the proxy (bgp or bmp)
proto:
